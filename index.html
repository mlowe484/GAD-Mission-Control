<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading GAD Mission Control V4</title><style>html,body{margin:0;background:#060b14;color:#b5d6eb;font:15px system-ui}main{max-width:600px;padding:42px 24px;margin:auto}h1{color:#eafaff;font-size:23px}small{color:#8ea4bd}</style></head><body><main id="boot"><h1>GAD Mission Control V4</h1><p>Loading flight replays and aperture cone controls…</p><small>The website may take a moment on mobile connections.</small></main><script>
(async()=>{
try{
 const [response, patchResponse] = await Promise.all([fetch('./v3.html?release=rc42-v3'),fetch('./v4-aperture.patch.js?release=v4')]);
 if(!response.ok||!patchResponse.ok)throw new Error('The viewer or cone patch is not accessible.');
 let html=await response.text();
 const patch=await patchResponse.text();
 const oldMarkup="</div></div></div>\n      <div class=\"phase-box\">";
 const newMarkup="</div></div><div class=\"cone-settings\"><label class=\"cone-checkbox\"><input id=\"coneToggle\" type=\"checkbox\" checked> Show illustrative coupling cone</label><div class=\"cone-range\"><label for=\"coneSpread\">Display half-angle</label><input id=\"coneSpread\" type=\"range\" min=\"5\" max=\"25\" step=\"1\" value=\"12\"><span id=\"coneSpreadValue\">12°</span></div><div class=\"cone-disclaimer\">Cone width is a visual setting, not measured GAD beam spread or footprint area.</div></div></div>\n      <div class=\"phase-box\">";
 const oldAim="This panel turns the θ/φ aperture command into an intuitive body-centered aim point. It is a visualization of coupling direction, not a literal optical camera view.";
 const newAim="The dot is the aperture axis projection. Cone and footprint widths are illustrative only; θ/φ and engine K are recorded RC42 commands.";
 const oldAbout="Aperture aim panel:</b> the θ/φ values are converted into an intuitive body-centered aim-point indicator.";
 const newAbout="Aperture visualization:</b> the θ/φ commands drive a centerline dot, an illustrative coupling cone, and an adjustable surface patch. Cone width is a display-only setting.";
 const css=".cone-settings{border-top:1px solid #233b52;margin-top:12px;padding-top:10px;display:grid;gap:10px}.cone-checkbox{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:700;color:#aee9e8;cursor:pointer}.cone-checkbox input{accent-color:#82e7e2}.cone-range{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:10px;color:#aec3d7}.cone-range input{min-width:0;accent-color:#80e3db}.cone-disclaimer{font-size:10px;color:#839eb6;line-height:1.5}";
 const close='</scr'+'ipt>';
 const ending='})();\n'+close;
 if(!html.includes(oldMarkup)||!html.includes(oldAim)||!html.includes(ending)) throw new Error('Unexpected viewer version; original file preserved.');
 html=html.replace('</style>',css+'\n</style>')
   .replace('Aperture aim visualization</div>','Aperture cone / coupling footprint</div>')
   .replace(oldAim,newAim)
   .replace(oldMarkup,newMarkup)
   .replace(oldAbout,newAbout)
   .replace(ending,patch+'\n'+ending);
 document.open();document.write(html);document.close();
}catch(err){
 console.error('V4 upgrade loader:',err);
 const boot=document.getElementById('boot');
 if(boot)boot.innerHTML='<h1>Mission Control could not load</h1><p>Try refreshing the page, or use the unchanged <a href="./v3.html" style="color:#75e9e0">V3 replay</a>.</p>';
}
})();
</script></body></html>
